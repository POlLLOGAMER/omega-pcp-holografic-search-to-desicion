[package]
name = "production_backend"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Production-oriented witness-only R1CS LDE backend using Arkworks"

[dependencies]
ark-ff = { git = "https://github.com/arkworks-rs/algebra", rev = "57be20e56a142b059bca05653961f8a9ca4f54ae", package = "ark-ff" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra", rev = "57be20e56a142b059bca05653961f8a9ca4f54ae", package = "ark-poly" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra", rev = "57be20e56a142b059bca05653961f8a9ca4f54ae", package = "ark-serialize" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
